name: mavera
description: "Güven Yüzüğü – hareket sensörlü yüzükle acil durum alarmı."
publish_to: 'none'

version: 1.0.2+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  battery_plus: ^7.1.2
  clock: ^1.1.3
  device_info_plus: ^13.3.0
  fl_chart: ^1.3.0
  flutter_blue_plus: ^2.3.14
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  flutter_native_contact_picker: ^0.0.13
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.2
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 26
